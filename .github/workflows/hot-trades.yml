name: 급등·급락 단지 갱신

on:
  schedule:
    # 매일 05:07 / 07:07 / 10:07 KST. 예약 지연·공공데이터포털 장애 대비 재시도 (오늘 성공했으면 스크립트가 건너뜀)
    - cron: "7 20 * * *"
    - cron: "7 22 * * *"
    - cron: "7 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 급등·급락 계산
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          # 공공데이터포털이 해외망을 막을 때 Vercel 서울 리전 프록시로 조회 (둘 다 있을 때만 사용)
          HOT_SOURCE_URL: ${{ secrets.HOT_SOURCE_URL }}
          HOT_BUILD_SECRET: ${{ secrets.HOT_BUILD_SECRET }}
          # 프록시 미사용 시 직접 호출용 (보통은 Vercel 쪽 키로 프록시가 조회)
          REB_KEY: ${{ secrets.REB_KEY }}
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          # 수동 실행은 오늘 갱신 여부와 관계없이 다시 계산
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: npm run hot:build
      - name: 변경 시 커밋
        run: |
          if git diff --quiet src/data/; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/hot-trades.json src/data/region-stats.json
          git commit -m "chore: 급등·급락 단지 갱신 ($(TZ=Asia/Seoul date +%F))"
          git push
