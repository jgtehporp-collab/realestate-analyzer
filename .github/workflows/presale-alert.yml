name: 신규 분양 텔레그램 알림

on:
  schedule:
    # 매일 09:23 / 13:23 / 18:23 KST
    - cron: "23 0 * * *"
    - cron: "23 4 * * *"
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: presale-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 신규 공고 확인·전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HOT_SOURCE_URL: ${{ secrets.HOT_SOURCE_URL }}
          HOT_BUILD_SECRET: ${{ secrets.HOT_BUILD_SECRET }}
        run: npm run presale:alert
      - name: 보낸 목록 커밋
        run: |
          if git diff --quiet src/data/ && [ -z "$(git status --porcelain src/data/)" ]; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/presale-seen.json
          git commit -m "chore: 분양 알림 기록 ($(TZ=Asia/Seoul date '+%F %H:%M'))"
          # 급등·급락 작업과 겹쳐도 되도록 최신 main 위에 올려서 푸시
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
